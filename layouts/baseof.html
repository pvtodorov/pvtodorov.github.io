<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
    <link rel="canonical" href="{{ .Permalink }}">
    {{ with .OutputFormats.Get "rss" }}
      <link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}" title="{{ site.Title }}">
    {{ end }}
    {{ with resources.Get "css/main.css" | minify | fingerprint }}
      <link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}">
    {{ end }}
  </head>
  <body>
    <main>
      <header class="site-header">
        <a class="site-title" href="{{ "/" | relURL }}">{{ site.Title }}</a>
        <nav>
          <a href="{{ "/" | relURL }}">Notes</a>
          <a href="{{ "/about/" | relURL }}">About</a>
          <a href="{{ "/index.xml" | relURL }}">RSS</a>
        </nav>
      </header>

      {{ block "main" . }}{{ end }}

      <footer>
        <p>© {{ now.Year }} {{ site.Title }} · <a href="{{ "/index.xml" | relURL }}">RSS</a></p>
      </footer>
    </main>
  </body>
</html>
