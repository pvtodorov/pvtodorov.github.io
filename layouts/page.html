{{ define "main" }}
<article>
  <header class="article-header">
    <h1>{{ .Title }}</h1>
    {{ if not .Date.IsZero }}
    <div class="meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
      {{ if ge .ReadingTime 1 }}<span class="kind">{{ .ReadingTime }} min read</span>{{ end }}
    </div>
    {{ end }}
  </header>

  <div class="content">
    {{ .Content }}
  </div>
</article>
{{ end }}
